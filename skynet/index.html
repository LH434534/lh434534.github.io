<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Skynet — IA na web</title>
<style>
:root{
  --bg:#080b11; --sup:#101620; --card:#161d29; --hi:#1d2634;
  --linha:#212b3a; --suave:#1a2230;
  --t1:#f0f4fa; --t2:#a3aec1; --t3:#6c7789;
  --ac:#5eead4; --ac2:#818cf8;
  --ok:#4ade80; --av:#fbbf24; --er:#f87171;
  --r:16px; --rpeq:10px;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--t1);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) 0 0;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(650px 380px at 12% -8%, rgba(94,234,212,.07), transparent 70%),
    radial-gradient(560px 340px at 92% 4%, rgba(129,140,248,.07), transparent 70%);
}

/* ---------- topo ---------- */
header{
  position:relative;z-index:2;display:flex;align-items:center;gap:11px;
  padding:11px 15px;background:rgba(16,22,32,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--linha);
}
.marca{font-size:18px;font-weight:750;letter-spacing:-.025em}
.marca span{
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.badge{
  font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;
  background:var(--suave);border:1px solid var(--linha);color:var(--t2);
  font-variant-numeric:tabular-nums;
}
.badge.ok{color:var(--ok);border-color:rgba(74,222,128,.28);background:rgba(74,222,128,.08)}
.badge.av{color:var(--av);border-color:rgba(251,191,36,.28);background:rgba(251,191,36,.08)}
.badge.er{color:var(--er);border-color:rgba(248,113,113,.28);background:rgba(248,113,113,.08)}
.menu{
  margin-left:auto;display:flex;gap:7px;
}
.mbtn{
  width:34px;height:34px;border-radius:var(--rpeq);
  background:var(--suave);border:1px solid var(--linha);color:var(--t2);
  font-size:14px;cursor:pointer;display:grid;place-items:center;
  transition:.16s;
}
.mbtn:active{transform:scale(.93)}
.mbtn.ativo{color:var(--ac);border-color:rgba(94,234,212,.35)}

/* ---------- conversas ---------- */
#conversas{
  position:absolute;top:0;left:0;bottom:0;width:78%;max-width:310px;z-index:20;
  background:var(--sup);border-right:1px solid var(--linha);
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding:14px;gap:8px;
}
#conversas.aberto{transform:none}
#conversas h3{font-size:11px;letter-spacing:.1em;color:var(--t3);text-transform:uppercase;padding:0 3px}
.item{
  padding:10px 12px;border-radius:var(--rpeq);background:var(--card);
  border:1px solid transparent;cursor:pointer;font-size:13.5px;
  display:flex;align-items:center;gap:8px;transition:.15s;
}
.item:hover{border-color:var(--linha)}
.item.ativo{border-color:rgba(94,234,212,.32);background:var(--hi)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{color:var(--t3);font-size:15px;padding:0 3px}
.nova{
  padding:11px;border-radius:var(--rpeq);border:1px dashed var(--linha);
  background:none;color:var(--ac);font-size:13.5px;font-weight:600;cursor:pointer;
}
#velo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;opacity:0;pointer-events:none;transition:.24s}
#velo.aberto{opacity:1;pointer-events:auto}

/* ---------- mensagens ---------- */
#lista{
  position:relative;z-index:1;flex:1;overflow-y:auto;
  padding:16px 15px 8px;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.msg{margin-bottom:15px;animation:entra .28s cubic-bezier(.2,.8,.3,1)}
@keyframes entra{from{opacity:0;transform:translateY(9px)}}
.quem{
  font-size:9.5px;letter-spacing:.1em;color:var(--t3);
  margin:0 3px 5px;text-transform:uppercase;font-weight:600;
}
.meu .quem{text-align:right}
.caixa{
  background:var(--card);border:1px solid var(--suave);
  border-radius:var(--r);padding:13px 15px;box-shadow:var(--sombra);
}
.meu .caixa{
  background:linear-gradient(135deg,rgba(94,234,212,.1),rgba(129,140,248,.1));
  border-color:var(--linha);margin-left:52px;
}
.bot .caixa{margin-right:52px}
.caixa p{white-space:pre-wrap;word-break:break-word}
.caixa p+p{margin-top:9px}
.caixa ul,.caixa ol{margin:7px 0;padding-left:20px}
.caixa li{margin:3px 0}
.caixa strong{font-weight:700;color:#fff}
.caixa em{font-style:italic;color:var(--t2)}
.caixa a{color:var(--ac);text-decoration:none;border-bottom:1px solid rgba(94,234,212,.3)}
.bloco{position:relative;margin:10px 0;border-radius:var(--rpeq);overflow:hidden;background:#0b1017;border:1px solid var(--linha)}
.bloco .top{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 11px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--linha);
}
.bloco .lg{font-size:10px;letter-spacing:.09em;color:var(--t3);text-transform:uppercase;font-weight:600}
.bloco .cp{
  background:none;border:none;color:var(--t3);font-size:10.5px;cursor:pointer;
  padding:3px 7px;border-radius:6px;
}
.bloco .cp:hover{color:var(--ac);background:var(--suave)}
.bloco pre{
  padding:11px 13px;overflow-x:auto;font-size:12.5px;line-height:1.55;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c8f5ec;
}
.codigo-in{
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
  background:#0b1017;color:var(--ac);padding:2px 6px;border-radius:5px;
  border:1px solid var(--linha);
}
.cursor{
  display:inline-block;width:2px;height:15px;background:var(--ac);
  vertical-align:-2px;margin-left:2px;animation:pisca 1.05s steps(2) infinite;
}
@keyframes pisca{50%{opacity:0}}
.acoes{display:flex;gap:15px;padding:6px 4px 0}
.acoes button{background:none;border:none;color:var(--t3);font-size:11px;cursor:pointer;padding:0;font-weight:500}
.acoes button:hover{color:var(--ac)}
.erro{
  background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.28);
  color:#fca5a5;border-radius:var(--rpeq);padding:12px 14px;font-size:13.5px;
}
.erro code{
  display:block;margin-top:7px;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;color:var(--t2);background:rgba(0,0,0,.25);
  padding:8px 10px;border-radius:7px;overflow-x:auto;white-space:pre;
}
.vazio{
  background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  padding:20px;box-shadow:var(--sombra);
}
.vazio h2{font-size:16.5px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.vazio p{font-size:13.5px;color:var(--t2);margin-bottom:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 13px;border-radius:20px;background:var(--suave);
  border:1px solid var(--linha);color:var(--t2);font-size:12.5px;cursor:pointer;
  transition:.15s;
}
.chip:hover{border-color:rgba(94,234,212,.35);color:var(--t1);transform:translateY(-1px)}
.nota{
  margin-top:14px;padding-top:13px;border-top:1px solid var(--linha);
  font-size:11.5px;color:var(--t3);line-height:1.6;
}

/* ---------- entrada ---------- */
footer{
  position:relative;z-index:2;background:rgba(16,22,32,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--linha);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
}
.linha{display:flex;gap:9px;align-items:flex-end}
#entrada{
  flex:1;background:var(--bg);color:var(--t1);border:1px solid var(--linha);
  border-radius:13px;padding:11px 14px;font:inherit;font-size:14.5px;
  resize:none;max-height:130px;outline:none;transition:.16s;line-height:1.5;
}
#entrada:focus{border-color:rgba(94,234,212,.45);background:#0a0e15}
#entrada::placeholder{color:var(--t3)}
#enviar{
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121a;
  border:none;border-radius:13px;padding:11px 17px;font-weight:750;font-size:14px;
  cursor:pointer;transition:.16s;box-shadow:0 3px 14px rgba(94,234,212,.2);
}
#enviar:active{transform:scale(.95)}
#enviar:disabled{opacity:.35;box-shadow:none;cursor:default}
#parar{display:none}
.rodape-nota{font-size:10.5px;color:var(--t3);text-align:center;margin-top:7px}

/* ---------- modal ---------- */
dialog{
  border:1px solid var(--linha);border-radius:18px;background:var(--sup);color:var(--t1);
  padding:22px;max-width:430px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(0,0,0,.68);backdrop-filter:blur(3px)}
dialog h2{font-size:17px;font-weight:700;margin-bottom:5px;letter-spacing:-.02em}
dialog .sub{font-size:12.5px;color:var(--t2);margin-bottom:16px;line-height:1.55}
dialog label{
  display:block;font-size:10px;color:var(--t3);margin:14px 0 5px;
  text-transform:uppercase;letter-spacing:.09em;font-weight:600;
}
dialog input,dialog select{
  width:100%;background:var(--bg);color:var(--t1);border:1px solid var(--linha);
  border-radius:var(--rpeq);padding:10px 12px;font:inherit;font-size:13.5px;outline:none;
}
dialog input:focus,dialog select:focus{border-color:rgba(94,234,212,.45)}
dialog .fechar{
  margin-top:20px;width:100%;padding:12px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121a;
  font-weight:750;font-size:14px;cursor:pointer;
}
.linha-status{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 13px;background:var(--bg);border:1px solid var(--linha);
  border-radius:var(--rpeq);font-size:12.5px;margin-top:10px;
}
.linha-status b{color:var(--t1)}
.ponto{width:7px;height:7px;border-radius:50%;background:var(--t3);flex:none}
.ponto.ok{background:var(--ok);box-shadow:0 0 8px rgba(74,222,128,.5)}
.ponto.er{background:var(--er)}
.ponto.av{background:var(--av)}
</style>
</head>
<body>

<div id="conversas">
  <h3>Conversas</h3>
  <button class="nova" id="nova">+ Nova conversa</button>
  <div id="itens" style="display:flex;flex-direction:column;gap:6px;overflow-y:auto"></div>
</div>
<div id="velo"></div>

<header>
  <button class="mbtn" id="menu" aria-label="Conversas">☰</button>
  <div class="marca">Skynet<span>Chat</span></div>
  <div class="badge" id="badge">—</div>
  <div class="menu">
    <button class="mbtn" id="limpar" title="Limpar conversa">⌫</button>
    <button class="mbtn" id="cfg" aria-label="Ajustes">⚙</button>
  </div>
</header>

<div id="lista"></div>

<footer>
  <div class="linha">
    <textarea id="entrada" rows="1" placeholder="Pergunte algo…"></textarea>
    <button id="enviar">Enviar</button>
    <button id="parar" class="mbtn" style="width:44px;height:44px">■</button>
  </div>
  <div class="rodape-nota" id="nota">skynetchat.net · sem chave · até 5 mensagens por conta</div>
</footer>

<dialog id="dlg">
  <h2>Ajustes</h2>
  <p class="sub">Este app fala direto com o endpoint público. Sem chave, sem servidor próprio.</p>

  <label for="prov">Provedor</label>
  <select id="prov">
    <option value="pollinations">Pollinations — verificado, CORS liberado</option>
    <option value="skynetchat">skynetchat.net — instável, Cloudflare</option>
    <option value="custom">Personalizado</option>
  </select>

  <label for="url">Endpoint</label>
  <input id="url" type="text" spellcheck="false">

  <label for="modelo">Modelo</label>
  <input id="modelo" type="text" spellcheck="false">

  <label for="sid">Cookie sid (opcional, só skynetchat)</label>
  <input id="sid" type="password" placeholder="mantém histórico no servidor" autocomplete="off">

  <label for="lim">Limite por conta</label>
  <input id="lim" type="number" value="5" min="1" max="100">

  <div class="linha-status">
    <span>Endpoint</span>
    <span style="display:flex;align-items:center;gap:7px">
      <span class="ponto" id="ponto"></span><b id="txtst">não testado</b>
    </span>
  </div>
  <button class="fechar" id="testar" style="background:var(--suave);color:var(--t1);border:1px solid var(--linha)">Testar agora</button>
  <button class="fechar" id="salvar">Salvar</button>
</dialog>

<script>
const $ = s => document.querySelector(s);
/* Provedores. O padrao e o unico verificado com CORS habilitado.
   skynetchat.net respondeu 200 numa sonda, mas agora devolve 403 com
   desafio do Cloudflare a partir de IP de datacenter — e nao envia
   cabecalho CORS. Um navegador residencial pode passar; um servidor nao. */
const PROVS = {
  pollinations: {
    nome: 'Pollinations (verificado)',
    url: 'https://text.pollinations.ai/openai/chat/completions',
    formato: 'openai', cors: true, chave: false,
  },
  skynetchat: {
    nome: 'skynetchat.net (instável)',
    url: 'https://skynetchat.net/api/chat',
    formato: 'aiskd', cors: false, chave: false,
  },
  custom: { nome: 'Personalizado', url: '', formato: 'openai', cors: false, chave: false },
};
const LIMITE_PADRAO = 999;

let provKey = localStorage.getItem('sk.prov') || 'pollinations';
if (!PROVS[provKey]) provKey = 'pollinations';
let apiUrl  = localStorage.getItem('sk.url') || PROVS[provKey].url;
let modelo  = localStorage.getItem('sk.modelo') || 'openai';
let sid     = localStorage.getItem('sk.sid') || '';
let limite  = Number(localStorage.getItem('sk.lim') || LIMITE_PADRAO);
let usadas = Number(localStorage.getItem('sk.usadas') || 0);
let conversas = JSON.parse(localStorage.getItem('sk.conv') || '[]');
let atual = localStorage.getItem('sk.atual');
if (!atual || !conversas.find(c => c.id === atual)) {
  atual = null;
}
let gerando = false, controle = null;

/* ---------------- estado ---------------- */
function salvar() {
  localStorage.setItem('sk.prov', provKey);
  localStorage.setItem('sk.url', apiUrl);
  localStorage.setItem('sk.modelo', modelo);
  localStorage.setItem('sk.sid', sid);
  localStorage.setItem('sk.lim', String(limite));
  localStorage.setItem('sk.usadas', String(usadas));
  localStorage.setItem('sk.conv', JSON.stringify(conversas));
  if (atual) localStorage.setItem('sk.atual', atual);
  else localStorage.removeItem('sk.atual');
}
function badge() {
  const b = $('#badge');
  const rest = Math.max(0, limite - usadas);
  b.textContent = usadas + '/' + limite;
  b.className = 'badge ' + (rest === 0 ? 'er' : rest <= 1 ? 'av' : 'ok');
  const cfg = PROVS[provKey] || PROVS.custom;
  $('#nota').textContent = (cfg.cors ? cfg.nome : cfg.nome + ' · sem CORS')
    + (rest === 0 ? ' · limite atingido' : '');
}
function hist() {
  const c = conversas.find(x => x.id === atual);
  return c ? c.msgs : [];
}
function renderMenu() {
  const box = $('#itens');
  box.innerHTML = '';
  conversas.slice().reverse().forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === atual ? ' ativo' : '');
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = c.msgs.find(m => m.role === 'user')?.content.slice(0, 34) || 'Nova conversa';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '×';
    x.onclick = e => {
      e.stopPropagation();
      conversas = conversas.filter(y => y.id !== c.id);
      if (atual === c.id) atual = null;
      salvar(); renderMenu(); renderMsgs();
    };
    d.onclick = () => { atual = c.id; salvar(); renderMenu(); renderMsgs(); fecharMenu(); };
    d.appendChild(t); d.appendChild(x);
    box.appendChild(d);
  });
}
function fecharMenu() { $('#conversas').classList.remove('aberto'); $('#velo').classList.remove('aberto'); }

/* ---------------- markdown ---------------- */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
/** Parser proprio. Escapa antes de montar HTML: nunca injeta. */
function md(src) {
  const partes = src.split(/```/);
  let out = '';
  partes.forEach((p, i) => {
    if (i % 2 === 1) {
      const m = p.match(/^([a-zA-Z0-9+#-]*)\n?/);
      const lg = m ? m[1] : '';
      const corpo = m ? p.slice(m[0].length) : p;
      const idc = 'c' + Math.random().toString(36).slice(2, 9);
      out += `<div class="bloco"><div class="top"><span class="lg">${esc(lg || 'código')}</span>` +
             `<button class="cp" data-alvo="${idc}">copiar</button></div>` +
             `<pre id="${idc}">${esc(corpo.replace(/\n$/, ''))}</pre></div>`;
    } else {
      let h = esc(p);
      h = h.replace(/`([^`\n]+)`/g, '<span class="codigo-in">$1</span>');
      h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      h = h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      const linhas = h.split('\n');
      let bloco = [], html = '';
      const fecha = () => {
        if (!bloco.length) return;
        const itens = bloco.map(l => l.replace(/^\s*[-*+]\s+/, '').replace(/^\s*\d+\.\s+/, ''));
        const ord = /^\s*\d+\./.test(bloco[0]);
        html += `<${ord ? 'ol' : 'ul'}>` + itens.map(x => `<li>${x}</li>`).join('') + `</${ord ? 'ol' : 'ul'}>`;
        bloco = [];
      };
      linhas.forEach(l => {
        if (/^\s*([-*+]|\d+\.)\s+/.test(l)) { bloco.push(l); return; }
        fecha();
        if (l.trim()) html += `<p>${l.replace(/\n/g, '<br>')}</p>`;
      });
      fecha();
      out += html;
    }
  });
  return out;
}

/* ---------------- render de mensagens ---------------- */
function renderMsgs() {
  const L = $('#lista'); L.innerHTML = '';
  const h = hist();
  if (!h.length) { vazio(); return; }
  h.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'meu' : 'bot');
    const q = document.createElement('div'); q.className = 'quem';
    q.textContent = m.role === 'user' ? 'você' : 'skynet';
    const c = document.createElement('div'); c.className = 'caixa';
    c.innerHTML = m.role === 'user' ? '<p>' + esc(m.content) + '</p>' : md(m.content);
    d.appendChild(q); d.appendChild(c);
    if (m.role === 'assistant') d.appendChild(acoes(m.content));
    L.appendChild(d);
  });
  bindCopiar();
  rolar();
}
function acoes(txt) {
  const a = document.createElement('div'); a.className = 'acoes';
  const cop = document.createElement('button'); cop.textContent = 'copiar';
  cop.onclick = () => { navigator.clipboard.writeText(txt); cop.textContent = 'copiado'; setTimeout(()=>cop.textContent='copiar',1300); };
  a.appendChild(cop);
  return a;
}
function bindCopiar() {
  document.querySelectorAll('.cp').forEach(b => {
    b.onclick = () => {
      const el = document.getElementById(b.dataset.alvo);
      navigator.clipboard.writeText(el ? el.textContent : '');
      b.textContent = 'copiado'; setTimeout(()=>b.textContent='copiar',1300);
    };
  });
}
function vazio() {
  const d = document.createElement('div'); d.className = 'vazio';
  d.innerHTML = '<h2>Bem-vindo ao SkynetChat</h2>' +
    '<p>Conversa direto com um provedor público pela rede. Sem chave de API, ' +
    'sem cadastro, sem servidor intermediário.</p>' +
    '<div class="chips">' +
    ['Explique fusíveis de forma simples','Escreva um quicksort em Python',
     'Resuma a teoria da relatividade','Crie um cronograma de estudos']
      .map(t=>`<button class="chip">${esc(t)}</button>`).join('') +
    '</div>' +
    '<div class="nota"><b>Verificado hoje:</b> Pollinations responde 200 com ' +
    '<code>access-control-allow-origin: *</code> — funciona direto do navegador, ' +
    'sem servidor. O skynetchat.net respondeu 200 numa sonda anterior, mas passou a ' +
    'devolver 403 com desafio do Cloudflare a partir de IP de datacenter, e não ' +
    'envia cabeçalho CORS — por isso não é o padrão. Nada aqui tenta burlar ' +
    'limite ou proteção de terceiros.</div>';
  $('#lista').appendChild(d);
  d.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    $('#entrada').value = c.textContent; $('#entrada').focus();
  });
}
function rolar() { const L = $('#lista'); L.scrollTop = L.scrollHeight; }

/* ---------------- chamada à API ---------------- */
function novaCaixa(papel) {
  const L = $('#lista');
  if (!hist().length) L.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'msg ' + (papel === 'user' ? 'meu' : 'bot');
  const q = document.createElement('div'); q.className = 'quem';
  q.textContent = papel === 'user' ? 'você' : 'skynet';
  const c = document.createElement('div'); c.className = 'caixa';
  d.appendChild(q); d.appendChild(c); L.appendChild(d);
  rolar();
  return { ext: d, caixa: c };
}

async function enviar() {
  const txt = $('#entrada').value.trim();
  if (!txt || gerando) return;
  $('#entrada').value = ''; autoAlt();
  gerando = true;
  $('#enviar').style.display = 'none'; $('#parar').style.display = 'grid';

  if (!atual) {
    atual = 'c' + Date.now().toString(36);
    conversas.push({ id: atual, msgs: [] });
  }
  const conv = conversas.find(c => c.id === atual);
  conv.msgs.push({ role: 'user', content: txt });

  const bu = novaCaixa('user'); bu.caixa.innerHTML = '<p>' + esc(txt) + '</p>';
  const bb = novaCaixa('bot');  bb.caixa.innerHTML = '<span class="cursor"></span>';

  const cfg = PROVS[provKey] || PROVS.custom;
  const corpo = cfg.formato === 'aiskd'
    ? JSON.stringify({
        id: atual.replace(/^c/, 'chat-'),
        trigger: 'submit-message',
        messages: conv.msgs.map(m => ({ role: m.role, content: m.content })),
      })
    : JSON.stringify({
        model: modelo,
        stream: true,
        messages: conv.msgs.map(m => ({ role: m.role, content: m.content })),
      });

  const cab = { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' };
  if (sid) cab['Cookie'] = 'sid=' + sid;

  let acc = '', buffer = '', bruto = '';
  try {
    controle = new AbortController();
    const resp = await fetch(apiUrl, {
      method: 'POST', headers: cab, body: corpo,
      signal: controle.signal, credentials: sid ? 'include' : 'omit',
    });

    if (!resp.ok) {
      throw new Error(mensagemErro(resp.status));
    }
    if (!resp.body) throw new Error('Resposta sem corpo — streaming não suportado.');

    const leitor = resp.body.getReader();
    const dec = new TextDecoder();

    for (;;) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      bruto += dec.decode(value, { stream: true });
      const linhas = buffer.split('\n');
      buffer = linhas.pop();           // ultima linha pode estar cortada
      for (const l of linhas) {
        const s = l.trim();
        if (!s.startsWith('data:')) continue;
        const dado = s.slice(5).trim();
        if (!dado || dado === '[DONE]') continue;
        let o; try { o = JSON.parse(dado); } catch (e) { continue; }

        // formato OpenAI (Pollinations): choices[0].delta.content
        const ch = o.choices && o.choices[0];
        const od = ch && (ch.delta || ch.message);
        if (od && typeof od.content === 'string') {
          acc += od.content;
          bb.caixa.innerHTML = md(acc) + '<span class="cursor"></span>';
          rolar();
          continue;
        }
        // formato AI SDK (skynetchat): type=text-delta
        const t = o.type;
        if (t === 'text-delta' && typeof o.delta === 'string') {
          acc += o.delta;
          bb.caixa.innerHTML = md(acc) + '<span class="cursor"></span>';
          rolar();
        } else if (t === 'text' && typeof o.text === 'string') {
          acc += o.text;
          bb.caixa.innerHTML = md(acc) + '<span class="cursor"></span>';
          rolar();
        } else if (t === 'error') {
          throw new Error(o.errorText || o.message || 'Erro no stream.');
        } else if (o.error || o.erro) {
          throw new Error(o.error || o.erro);
        } else if (typeof o.content === 'string') {
          acc += o.content;
          bb.caixa.innerHTML = md(acc) + '<span class="cursor"></span>';
        }
      }
    }
    // sobra do buffer
    if (buffer.trim().startsWith('data:')) {
      const d = buffer.trim().slice(5).trim();
      if (d && d !== '[DONE]') {
        try {
          const o = JSON.parse(d);
          if (o.type === 'text-delta') acc += o.delta;
          if (o.type === 'text') acc += o.text;
        } catch (e) { /* incompleto: descarta */ }
      }
    }

    bb.caixa.innerHTML = md(acc || '(resposta vazia)');
    if (acc) {
      conv.msgs.push({ role: 'assistant', content: acc });
      bb.ext.appendChild(acoes(acc));
      bindCopiar();
      usadas++; salvar(); badge();
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      if (acc) { conv.msgs.push({ role: 'assistant', content: acc }); salvar(); }
      bb.caixa.innerHTML = md(acc) + '<p style="color:var(--t3);font-size:12px;margin-top:8px">— interrompido —</p>';
    } else {
      bb.caixa.innerHTML = '<div class="erro">' + esc(e.message) +
        '<code>' + esc(corpo.slice(0, 200)) + '</code></div>';
    }
  } finally {
    gerando = false; controle = null;
    $('#enviar').style.display = ''; $('#parar').style.display = 'none';
    salvar(); renderMenu(); rolar();
  }
}

function mensagemErro(c) {
  switch (c) {
    case 400: return 'Requisição rejeitada. O formato do payload pode ter mudado.';
    case 401: case 403: return 'Acesso recusado. Se houver sid configurado, ele pode ter expirado.';
    case 404: return 'Endpoint não encontrado. Confira a URL nos ajustes.';
    case 429: return 'Limite atingido. Este app não burla limites — inicie uma nova conversa.';
    case 500: case 502: case 503: return 'Serviço indisponível agora. Tente de novo em instantes.';
    default: return 'Erro HTTP ' + c;
  }
}

/* ---------------- ajustes ---------------- */
$('#cfg').onclick = () => {
  $('#prov').value = provKey; $('#url').value = apiUrl;
  $('#modelo').value = modelo; $('#sid').value = sid; $('#lim').value = limite;
  $('#dlg').showModal();
};
$('#salvar').onclick = () => {
  provKey = $('#prov').value;
  modelo = $('#modelo').value.trim() || 'openai';
  apiUrl = $('#url').value.trim() || (PROVS[provKey] ? PROVS[provKey].url : '');
  sid = $('#sid').value.trim();
  limite = Math.max(1, Number($('#lim').value) || LIMITE_PADRAO);
  salvar(); badge(); $('#dlg').close();
};
$('#prov').onchange = () => {
  const p = PROVS[$('#prov').value];
  if (p && p.url) $('#url').value = p.url;
};
$('#testar').onclick = async () => {
  const p = $('#ponto'), t = $('#txtst');
  p.className = 'ponto'; t.textContent = 'testando…';
  const ini = performance.now();
  try {
    const r = await fetch($('#url').value.trim() || API_PADRAO, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ model: 'openai', stream: false,
        messages: [{ role: 'user', content: 'Responda apenas: ok' }] }),
      signal: AbortSignal.timeout(25000),
    });
    const ms = Math.round(performance.now() - ini);
    p.className = 'ponto ' + (r.ok ? 'ok' : 'er');
    t.textContent = r.ok ? `HTTP ${r.status} · ${ms} ms` : `HTTP ${r.status}`;
  } catch (e) {
    p.className = 'ponto er';
    t.textContent = e.name === 'TimeoutError' ? 'timeout' : 'falhou: ' + (e.message || '').slice(0, 26);
  }
};

/* ---------------- interface ---------------- */
function autoAlt() {
  const e = $('#entrada'); e.style.height = 'auto';
  e.style.height = Math.min(e.scrollHeight, 130) + 'px';
}
$('#entrada').oninput = autoAlt;
$('#entrada').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
};
$('#enviar').onclick = enviar;
$('#parar').onclick = () => { if (controle) controle.abort(); };
$('#menu').onclick = () => {
  $('#conversas').classList.add('aberto'); $('#velo').classList.add('aberto');
};
$('#velo').onclick = fecharMenu;
$('#nova').onclick = () => {
  atual = null; salvar(); renderMenu(); renderMsgs(); fecharMenu(); badge();
};
$('#limpar').onclick = () => {
  const c = conversas.find(x => x.id === atual);
  if (c) { c.msgs = []; salvar(); renderMsgs(); }
};

renderMenu(); renderMsgs(); badge(); autoAlt();
</script>
</body>
