<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-bind="login">GitHub — Painel</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#11151f; --card:#151b26; --card2:#1a212e;
  --line:#232c3d; --line2:#2e394f;
  --txt:#e6edf3; --txt2:#9aa7b8; --txt3:#6b7889;
  --acc:#5eead4; --acc2:#38bdf8; --acc3:#a78bfa; --warn:#fbbf24; --red:#f87171;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, #17233a 0%, transparent 55%),
    radial-gradient(900px 500px at 92% 4%, #1a1630 0%, transparent 50%),
    var(--bg);
  color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 80px}

/* ---------- header ---------- */
.hero{
  display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(94,234,212,.09),rgba(167,139,250,.07));
  border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(120deg,transparent 30%,rgba(255,255,255,.035) 50%,transparent 70%);
  pointer-events:none}
.avatar{width:104px;height:104px;border-radius:50%;border:3px solid var(--acc);
  box-shadow:0 0 0 6px rgba(94,234,212,.10),0 10px 30px rgba(0,0,0,.5);flex-shrink:0;
  background:var(--card2)}
.hero-txt{flex:1;min-width:260px}
.handle{font-size:31px;font-weight:800;letter-spacing:-.6px;line-height:1.15;
  background:linear-gradient(92deg,var(--acc),var(--acc2) 55%,var(--acc3));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--txt2);margin-top:5px;font-size:14.5px}
.sub a{color:var(--acc2);text-decoration:none}
.sub a:hover{text-decoration:underline}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{font-size:12px;padding:5px 11px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line2);color:var(--txt2)}
.badge b{color:var(--acc)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{padding:9px 17px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line2);background:var(--card2);color:var(--txt);
  text-decoration:none;display:inline-flex;align-items:center;gap:7px;
  transition:.18s;font-family:inherit}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(92deg,var(--acc),var(--acc2));color:#06222a;border:none}
.btn.on{background:rgba(94,234,212,.16);border-color:var(--acc);color:var(--acc)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;
  transition:.18s}
.stat:hover{border-color:var(--line2);transform:translateY(-2px)}
.stat .n{font-size:27px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.9px;margin-top:3px}
.c1 .n{color:var(--acc)} .c2 .n{color:var(--acc2)} .c3 .n{color:var(--acc3)}
.c4 .n{color:var(--warn)} .c5 .n{color:var(--red)} .c6 .n{color:#f0abfc}

/* ---------- nav / tabs ---------- */
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);
  padding-bottom:12px}
nav button{background:transparent;border:1px solid transparent;color:var(--txt2);
  font-size:14px;font-weight:600;padding:8px 15px;border-radius:9px;cursor:pointer;
  transition:.15s;font-family:inherit}
nav button:hover{color:var(--txt);background:var(--card)}
nav button.at{color:#06222a;background:linear-gradient(92deg,var(--acc),var(--acc2))}
section{display:none;animation:fade .3s ease}
section.at{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- layout ---------- */
.grid2{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;
  gap:9px;color:var(--txt)}
.panel h2::before{content:"";width:3px;height:15px;border-radius:2px;
  background:linear-gradient(var(--acc),var(--acc2))}
.panel h2 small{margin-left:auto;font-size:11.5px;color:var(--txt3);font-weight:500}

/* ---------- repo cards ---------- */
.repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.repo{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);
  padding:17px;transition:.18s;cursor:pointer;position:relative;overflow:hidden}
.repo:hover{border-color:var(--acc);transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(0,0,0,.45)}
.repo .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.repo .nm{font-size:15.5px;font-weight:700;color:var(--acc2);word-break:break-word;
  text-decoration:none;line-height:1.3}
.repo .nm:hover{text-decoration:underline}
.tag{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(251,191,36,.13);
  color:var(--warn);border:1px solid rgba(251,191,36,.28);white-space:nowrap;flex-shrink:0}
.tag.a{background:rgba(107,120,137,.13);color:var(--txt3);border-color:var(--line2)}
.repo .ds{color:var(--txt2);font-size:13.3px;margin-top:8px;min-height:20px}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:12.2px;color:var(--txt3)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:13px;background:var(--bg2)}
.bar i{display:block;height:100%}
.repo .foot{margin-top:11px;font-size:11.3px;color:var(--txt3);display:flex;gap:12px;flex-wrap:wrap}

/* ---------- commits / feed ---------- */
.cm{border-left:2px solid var(--line2);padding-left:14px;margin-left:5px}
.ci{position:relative;padding:7px 0}
.ci::before{content:"";position:absolute;left:-20px;top:13px;width:9px;height:9px;
  border-radius:50%;background:var(--acc2);box-shadow:0 0 0 3px var(--card)}
.ci .m{font-size:13.5px;color:var(--txt);word-break:break-word}
.ci .d{font-size:11.5px;color:var(--txt3);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}
.sha{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc3);
  background:rgba(167,139,250,.11);padding:1px 6px;border-radius:5px;font-size:11px}
.ev{padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:none}
.ev .h{font-size:13.5px}
.ev .h b{color:var(--acc2)}
.ev .t{font-size:11.5px;color:var(--txt3);margin-top:3px}
.ev .ms{font-size:12.3px;color:var(--txt2);margin-top:5px;padding-left:10px;
  border-left:2px solid var(--line2)}
.ev .ms div{padding:1.5px 0;word-break:break-word}

/* ---------- langs ---------- */
.lang{display:flex;align-items:center;gap:11px;padding:8px 0}
.lang .nm{width:104px;font-size:13.3px;flex-shrink:0}
.lang .tr{flex:1;height:9px;background:var(--bg2);border-radius:5px;overflow:hidden}
.lang .fl{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.lang .pc{width:52px;text-align:right;font-size:12px;color:var(--txt3);flex-shrink:0}
.lang .kb{width:66px;text-align:right;font-size:11.3px;color:var(--txt3);flex-shrink:0}

/* ---------- heatmap ---------- */
.heat{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--bg2);display:block}
.heat i[data-l="1"]{background:rgba(94,234,212,.28)}
.heat i[data-l="2"]{background:rgba(94,234,212,.5)}
.heat i[data-l="3"]{background:rgba(94,234,212,.72)}
.heat i[data-l="4"]{background:var(--acc)}
.lgd{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--txt3);margin-top:10px}

/* ---------- people ---------- */
.people{display:flex;flex-wrap:wrap;gap:9px}
.person{display:flex;align-items:center;gap:8px;background:var(--card2);
  border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 5px;
  text-decoration:none;color:var(--txt);font-size:13px;transition:.15s}
.person:hover{border-color:var(--acc)}
.person img{width:26px;height:26px;border-radius:50%}

/* ---------- readme ---------- */
.rm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:15px;
  max-height:330px;overflow:auto;font-size:13px;color:var(--txt2);white-space:pre-wrap;
  word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}
.rm h1,.rm h2,.rm h3{color:var(--acc);margin:10px 0 6px;font-family:inherit}
.rm code{background:rgba(94,234,212,.1);color:var(--acc);padding:1px 5px;border-radius:4px}
.rm a{color:var(--acc2)}

/* ---------- misc ---------- */
.empty{color:var(--txt3);font-size:13.3px;padding:22px;text-align:center}
.srch{width:100%;padding:10px 14px;border-radius:10px;background:var(--card2);
  border:1px solid var(--line2);color:var(--txt);font-size:14px;font-family:inherit;
  margin-bottom:14px;outline:none}
.srch:focus{border-color:var(--acc)}
.foot-note{text-align:center;color:var(--txt3);font-size:12px;margin-top:34px;
  padding-top:18px;border-top:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt3)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 0 rgba(94,234,212,.6);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(94,234,212,0)}100%{box-shadow:0 0 0 0 rgba(94,234,212,0)}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--acc3)}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <img class="avatar" id="av" alt="avatar">
    <div class="hero-txt">
      <div class="handle" id="hl">—</div>
      <div class="sub" id="sb">—</div>
      <div class="badges" id="bd"></div>
      <div class="actions">
        <a class="btn pri" id="ghlink" target="_blank" rel="noopener">Abrir no GitHub ↗</a>
        <button class="btn" id="refresh">↻ Recarregar dados</button>
        <button class="btn" id="theme">◐ Tema</button>
      </div>
    </div>
  </div>

  <div class="stats" id="st"></div>

  <nav>
    <button data-t="repos" class="at">Repositórios</button>
    <button data-t="ativo">Atividade</button>
    <button data-t="code">Linguagens</button>
    <button data-t="social">Social</button>
  </nav>

  <!-- ============ REPOS ============ -->
  <section id="repos" class="at">
    <input class="srch" id="q" placeholder="🔍 filtrar por nome, linguagem ou descrição...">
    <div class="repos" id="rp"></div>
  </section>

  <!-- ============ ATIVIDADE ============ -->
  <section id="ativo">
    <div class="grid2">
      <div class="panel">
        <h2>Linha do tempo <small id="evn"></small></h2>
        <div id="feed"></div>
      </div>
      <div>
        <div class="panel">
          <h2>Mapa de contribuições <small>últimos 12 meses</small></h2>
          <div class="heat" id="heat"></div>
          <div class="lgd">menos <i class="heat" style="display:flex;gap:3px">
            <i></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i>
          </i> mais</div>
        </div>
        <div class="panel">
          <h2>Distribuição</h2>
          <div id="etype"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ LINGUAGENS ============ -->
  <section id="code">
    <div class="grid2">
      <div class="panel">
        <h2>Linguagens por bytes <small id="ltot"></small></h2>
        <div id="langs"></div>
      </div>
      <div>
        <div class="panel">
          <h2>Top repositórios por tamanho</h2>
          <div id="big"></div>
        </div>
        <div class="panel">
          <h2>Linha do tempo de criação</h2>
          <div id="tline"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ SOCIAL ============ -->
  <section id="social">
    <div class="grid2">
      <div class="panel">
        <h2>Com README <small>documentação dos projetos</small></h2>
        <div id="rms"></div>
      </div>
      <div>
        <div class="panel">
          <h2>Estrelados <small id="stn"></small></h2>
          <div id="starred"></div>
        </div>
        <div class="panel">
          <h2>Seguindo <small id="fwn"></small></h2>
          <div class="people" id="fwg"></div>
        </div>
        <div class="panel">
          <h2>Seguidores <small id="frn"></small></h2>
          <div class="people" id="frs"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="foot-note">
    <span class="live"><span class="pulse"></span> dados reais da API do GitHub · gerado em <b id="gen"></b></span>
  </div>
</div>

<script>
const LC = {
  Python:"#3572A5",JavaScript:"#f1e05a",TypeScript:"#3178c6",Java:"#b07219",
  HTML:"#e34c26",CSS:"#563d7c",Shell:"#89e051",Dockerfile:"#384d54",
  Go:"#00ADD8",Rust:"#dea584","C++":"#f34b7d",C:"#555555",Ruby:"#701516",
  PHP:"#4F5D95",Swift:"#F05138",Kotlin:"#A97BFF",Vue:"#41b883",Jupyter:"#DA5B0B"
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let D=null;

const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n);
const kb=n=>n>=1024?(n/1024).toFixed(1)+" MB":n+" KB";
const dt=s=>{if(!s)return"—";const d=new Date(s);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"});};
const ago=s=>{if(!s)return"";const m=(Date.now()-new Date(s))/6e4;
  if(m<1)return"agora";if(m<60)return Math.floor(m)+"min";
  if(m<1440)return Math.floor(m/60)+"h";if(m<43200)return Math.floor(m/1440)+"d";
  return Math.floor(m/43200)+"mês";};
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function boot(){
  const r=await fetch("data.json?t="+Date.now());
  D=await r.json();
  D.repos.sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
  paint();
}

function paint(){
  const u=D.user;
  document.title = u.login+" · Painel GitHub";
  $("#av").src=u.avatar; $("#av").onerror=e=>e.target.style.visibility="hidden";
  $("#hl").textContent="@"+u.login;
  $("#sb").innerHTML = (u.bio?esc(u.bio)+" · ":"")+
    `na plataforma desde ${dt(u.created)} · <a href="${u.url}" target="_blank" rel="noopener">${esc(u.url.replace("https://",""))}</a>`;
  $("#ghlink").href=u.url;

  const totStar=D.repos.reduce((s,r)=>s+r.stars,0);
  const totCommit=D.repos.reduce((s,r)=>s+r.commit_count,0);
  const totKb=D.repos.reduce((s,r)=>s+r.size_kb,0);
  $("#bd").innerHTML=[
    `<span class="badge">🚀 <b>${u.public_repos}</b> públicos</span>`,
    `<span class="badge">📦 <b>${D.repos.length}</b> no total</span>`,
    `<span class="badge">💾 <b>${kb(totKb)}</b> de código</span>`,
    u.blog?`<span class="badge">🔗 <b>${esc(u.blog.replace(/^https?:\/\//,""))}</b></span>`:"",
    u.location?`<span class="badge">📍 <b>${esc(u.location)}</b></span>`:""
  ].join("");

  $("#st").innerHTML=[
    ["c1",D.repos.length,"Repositórios"],
    ["c2",fmt(totCommit),"Commits (amostra)"],
    ["c3",D.languages.length,"Linguagens"],
    ["c4",kb(totKb),"Tamanho total"],
    ["c5",totStar,"Estrelas"],
    ["c6",D.events.length,"Eventos"]
  ].map(([c,n,l])=>`<div class="stat ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  $("#gen").textContent=D.generated;

  drawRepos();
  drawFeed();
  drawHeat();
  drawLangs();
  drawSocial();
}

/* -------- repos -------- */
function drawRepos(f=""){
  const q=f.toLowerCase();
  const list=D.repos.filter(r=>!q||(r.name+" "+r.desc+" "+(r.lang||"")+" "+r.topics.join(" ")).toLowerCase().includes(q));
  $("#rp").innerHTML = list.length ? list.map(r=>{
    const L=Object.entries(r.langs||{}).sort((a,b)=>b[1]-a[1]);
    const tot=L.reduce((s,[,v])=>s+v,0)||1;
    const top=L.slice(0,4).map(([k,v])=>
      `<i style="width:${(v/tot*100).toFixed(1)}%;background:${LC[k]||"#6b7889"}" title="${esc(k)} ${(v/tot*100).toFixed(0)}%"></i>`).join("");
    const last=(r.commits&&r.commits[0])||null;
    return `<div class="repo" onclick="window.open('${r.html_url}','_blank')">
      <div class="top">
        <a class="nm" href="${r.html_url}" target="_blank" rel="noopener"
           onclick="event.stopPropagation()">${esc(r.name)}</a>
        ${r.archived?'<span class="tag a">arquivado</span>':r.fork?'<span class="tag a">fork</span>':""}
      </div>
      <div class="ds">${esc(r.desc||"sem descrição")}</div>
      <div class="bar">${top}</div>
      <div class="meta">
        ${r.lang?`<span><i class="dot" style="background:${LC[r.lang]||"#6b7889"}"></i>${esc(r.lang)}</span>`:""}
        <span>⭐ ${r.stars}</span><span>🍴 ${r.forks}</span>
        <span>📝 ${r.commit_count} commits</span><span>💾 ${kb(r.size_kb)}</span>
      </div>
      <div class="foot">
        <span>atualizado ${ago(r.updated)}</span>
        ${last?`<span>último: <span class="sha">${last.sha}</span> ${esc(last.msg.slice(0,42))}</span>`:""}
      </div></div>`;
  }).join("") : `<div class="empty">nada encontrado para "${esc(f)}"</div>`;
}

/* -------- feed -------- */
function drawFeed(){
  $("#evn").textContent=D.events.length+" eventos";
  $("#feed").innerHTML = D.events.length ? D.events.map(e=>`
    <div class="ev">
      <div class="h"><b>${esc(e.label)}</b> · ${esc(e.repo)} ${e.extra?`· <span style="color:var(--txt3)">${esc(e.extra)}</span>`:""}</div>
      <div class="t">${dt(e.date)} · ${ago(e.date)} atrás</div>
      ${e.msgs&&e.msgs.length?`<div class="ms">${e.msgs.map(m=>"<div>· "+esc(m)+"</div>").join("")}</div>`:""}
    </div>`).join("") : '<div class="empty">sem eventos públicos</div>';

  const c={};
  D.events.forEach(e=>c[e.label]=(c[e.label]||0)+1);
  $("#etype").innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const p=(v/D.events.length*100).toFixed(0);
    return `<div class="lang"><div class="nm">${esc(k)}</div>
      <div class="tr"><div class="fl" style="width:${p}%;background:linear-gradient(90deg,var(--acc),var(--acc2))"></div></div>
      <div class="pc">${v}</div></div>`;
  }).join("");
}

/* -------- heatmap -------- */
function drawHeat(){
  const h=D.heatmap||{};
  const days=[];
  const now=new Date();
  for(let i=364;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const mx=Math.max(1,...Object.values(h));
  $("#heat").innerHTML=days.map(d=>{
    const v=h[d]||0;
    const l=v===0?0:Math.min(4,Math.ceil(v/mx*4));
    return `<i data-l="${l}" title="${d}: ${v} evento(s)"></i>`;
  }).join("");
}

/* -------- langs -------- */
function drawLangs(){
  const L=D.languages, tot=L.reduce((s,[,v])=>s+v,0)||1;
  $("#ltot").textContent=kb(Math.round(tot/1024));
  $("#langs").innerHTML=L.length?L.map(([k,v])=>{
    const p=(v/tot*100).toFixed(1);
    return `<div class="lang">
      <div class="nm"><i class="dot" style="background:${LC[k]||"#6b7889"}"></i> ${esc(k)}</div>
      <div class="tr"><div class="fl" style="width:${p}%;background:${LC[k]||"#6b7889"}"></div></div>
      <div class="pc">${p}%</div><div class="kb">${kb(Math.round(v/1024))}</div></div>`;
  }).join(""):'<div class="empty">sem dados</div>';

  const big=[...D.repos].sort((a,b)=>b.size_kb-a.size_kb).slice(0,8);
  const m=big[0]?.size_kb||1;
  $("#big").innerHTML=big.map(r=>`
    <div class="lang">
      <div class="nm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <a href="${r.html_url}" target="_blank" rel="noopener" style="color:var(--acc2);text-decoration:none">${esc(r.name)}</a></div>
      <div class="tr"><div class="fl" style="width:${(r.size_kb/m*100).toFixed(0)}%;background:linear-gradient(90deg,var(--acc3),var(--acc2))"></div></div>
      <div class="pc"></div><div class="kb">${kb(r.size_kb)}</div></div>`).join("");

  const byYear={};
  D.repos.forEach(r=>{const y=(r.created||"").slice(0,7); if(y)byYear[y]=(byYear[y]||0)+1;});
  const ys=Object.entries(byYear).sort();
  const mx2=Math.max(1,...ys.map(([,v])=>v));
  $("#tline").innerHTML=ys.length?ys.map(([y,v])=>`
    <div class="lang"><div class="nm">${y}</div>
      <div class="tr"><div class="fl" style="width:${(v/mx2*100).toFixed(0)}%;background:linear-gradient(90deg,var(--acc),var(--acc3))"></div></div>
      <div class="pc">${v}</div><div class="kb"></div></div>`).join(""):'<div class="empty">—</div>';
}

/* -------- social -------- */
function md(s){
  return esc(s)
    .replace(/^#{1,6}\s*(.+)$/gm,'<h3>$1</h3>')
    .replace(/```[\s\S]*?```/g,m=>"<code>"+m.replace(/```/g,"")+"</code>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}
function drawSocial(){
  const withRm=D.repos.filter(r=>r.readme&&r.readme.trim().length>30);
  $("#rms").innerHTML=withRm.length?withRm.map(r=>`
    <div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <a href="${r.html_url}" target="_blank" rel="noopener"
           style="color:var(--acc2);font-weight:700;text-decoration:none">${esc(r.name)}</a>
        <span style="font-size:11px;color:var(--txt3)">README · ${r.readme.length} chars</span>
      </div>
      <div class="rm">${md(r.readme.slice(0,2200))}</div>
    </div>`).join(""):'<div class="empty">nenhum README encontrado</div>';

  $("#stn").textContent=D.starred.length+" itens";
  $("#starred").innerHTML=D.starred.length?D.starred.map(s=>`
    <div class="ev">
      <div class="h"><a href="${s.url}" target="_blank" rel="noopener"
        style="color:var(--acc2);text-decoration:none;font-weight:600">${esc(s.name)}</a></div>
      <div class="t">${esc(s.desc)||"—"}</div>
      <div class="t">⭐ ${fmt(s.stars)} ${s.lang?"· "+esc(s.lang):""}</div>
    </div>`).join(""):'<div class="empty">nada estrelado ainda</div>';

  const fw=D.following, fs=D.followers;
  $("#fwn").textContent=fw.length+" · "+(D.user.following||fw.length);
  $("#frn").textContent=fs.length+" · "+(D.user.followers||fs.length);
  $("#fwg").innerHTML=fw.length?fw.map(p=>`
    <a class="person" href="${p.url}" target="_blank" rel="noopener">
      <img src="${p.avatar}" alt="" onerror="this.style.visibility='hidden'">${esc(p.login)}</a>`).join("")
    :'<div class="empty" style="padding:8px">não segue ninguém</div>';
  $("#frs").innerHTML=fs.length?fs.map(p=>`
    <a class="person" href="${p.url}" target="_blank" rel="noopener">
      <img src="${p.avatar}" alt="" onerror="this.style.visibility='hidden'">${esc(p.login)}</a>`).join("")
    :'<div class="empty" style="padding:8px">sem seguidores ainda</div>';
}

/* -------- ui -------- */
$$("nav button").forEach(b=>b.onclick=()=>{
  $$("nav button").forEach(x=>x.classList.remove("at"));
  $$("section").forEach(s=>s.classList.remove("at"));
  b.classList.add("at");
  $("#"+b.dataset.t).classList.add("at");
});
$("#q").oninput=e=>drawRepos(e.target.value);
$("#refresh").onclick=()=>location.reload();
$("#theme").onclick=()=>{
  const light=document.body.dataset.l==="1";
  if(light){delete document.body.dataset.l;
    document.documentElement.style.removeProperty("--bg");return;}
  document.body.dataset.l="1";
  const s=document.createElement("style");
  s.textContent=`:root{--bg:#f4f6fa;--bg2:#e9edf4;--card:#fff;--card2:#f7f9fc;
    --line:#dfe4ec;--line2:#cbd3e0;--txt:#131a24;--txt2:#4d5a6c;--txt3:#7d8896}`;
  document.head.appendChild(s);
};
boot().catch(e=>{
  document.body.insertAdjacentHTML("afterbegin",
    `<div class="panel" style="border-color:var(--red)">falha ao carregar data.json: ${esc(e.message)}</div>`);
});
</script>
</body>
</html>
